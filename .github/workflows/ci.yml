# Se ejecuta solo en cada push a main y en cada pull request.
# Si algo falla, GitHub te avisa por correo y marca el commit con una ✗ roja.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  dependencias:
    name: Backend (vulnerabilidades conocidas)
    runs-on: ubuntu-latest
    continue-on-error: true   # avisa, pero no bloquea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    name: App (tipos y exportación web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GymApp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
